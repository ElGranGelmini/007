name: Actualizar informe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'server/**'
      - 'tests/**'
      - 'public/**'
  schedule:
    # Intentos redundantes: GitHub puede retrasar u omitir algún inicio.
    # Madrid 08:00-21:59 se comprueba al ejecutarse, también en horario de verano.
    # 06-20 UTC incluye 08-21 en Madrid tanto en verano como en invierno.
    - cron: '7,22,37,52 6-20 * * *'

permissions:
  contents: read

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  build:
    if: vars.SOURCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      updated: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determinar si toca actualizar (hora Madrid)
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python server/schedule_gate.py
      - name: Comprobar motor
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests
      - name: Obtener y agregar
        if: steps.gate.outputs.should_run == 'true'
        env:
          TARGET_NUMBER: ${{ secrets.TARGET_NUMBER }}
          PUBLISH_COARSE_FORECAST: ${{ vars.PUBLISH_COARSE_FORECAST }}
        run: python server/update.py
      - name: Verificar informe generado
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone
          s = Path("public/data.js").read_text(encoding="utf-8").strip()
          assert s.startswith("window.SHURMAN=")
          data = json.loads(re.sub(r";$", "", s.removeprefix("window.SHURMAN=")))
          checked = datetime.fromisoformat(data["checked_at"])
          assert abs((datetime.now(timezone.utc) - checked).total_seconds()) < 600
          assert data["source_last_at"]
          assert data.get("recent") is not None
          assert data.get("phase") in ("first", "second")
          print("Fase y fecha de jornada:", data["phase"], data["updated"])
          print("Informe generado con fuente oficial:", data["source_last_at"])
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.should_run == 'true'
        with:
          path: public

  deploy:
    if: needs.build.outputs.updated == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
