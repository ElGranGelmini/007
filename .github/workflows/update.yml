name: Actualizar informe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'server/**'
      - 'tests/**'
      - 'public/**'
  schedule:
    # Github puede retrasar el inicio: la tarea no debe descartarse por el
    # reloj real cuando por fin arranca.
    - cron: '23 7-23 * * 1-4'
    # Comprobación adicional de cierre en la madrugada siguiente.
    - cron: '41 0 * * 2-5'
permissions:
  contents: read
concurrency:
  group: informe
  cancel-in-progress: false
jobs:
  build:
    if: vars.SOURCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar motor
        run: python -m unittest discover -s tests
      - name: Obtener y agregar
        env:
          TARGET_NUMBER: ${{ secrets.TARGET_NUMBER }}
          PUBLISH_COARSE_FORECAST: ${{ vars.PUBLISH_COARSE_FORECAST }}
        run: python server/update.py
      - name: Verificar que el nuevo informe fue generado
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone
          s = Path("public/data.js").read_text(encoding="utf-8").strip()
          assert s.startswith("window.SHURMAN=")
          data = json.loads(re.sub(r";$", "", s.removeprefix("window.SHURMAN=")))
          checked = datetime.fromisoformat(data["checked_at"])
          assert abs((datetime.now(timezone.utc) - checked).total_seconds()) < 600
          assert data["source_last_at"]
          assert data.get("recent") is not None
          print("Informe generado con fuente oficial:", data["source_last_at"])
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
