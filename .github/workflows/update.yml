name: Actualizar informe
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15,21 * * *'
    timezone: Europe/Madrid
permissions:
  contents: read
concurrency:
  group: informe
  cancel-in-progress: false
jobs:
  build:
    if: vars.SOURCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar motor
        run: python -m unittest discover -s tests
      - name: Obtener y agregar
        env:
          TARGET_NUMBER: ${{ secrets.TARGET_NUMBER }}
          PUBLISH_COARSE_FORECAST: ${{ vars.PUBLISH_COARSE_FORECAST }}
        run: python server/update.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
